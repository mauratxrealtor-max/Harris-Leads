name: Scrape Harris County Motivated Seller Leads
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 lxml requests pypdf
          pip install -r scraper/requirements.txt || echo "Requirements fallback"
          playwright install chromium
      - name: Create output directories
        run: mkdir -p dashboard data
      - name: Run scraper
        run: |
          python scraper/fetch.py
          cp dashboard/records.json records.json
        env:
          LOOKBACK_DAYS: 14
      - name: Verify output files exist
        run: |
          if [ ! -f "dashboard/records.json" ]; then
            echo "Error: dashboard/records.json was not generated!"
            exit 1
          fi
      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/records.json data/records.json data/ghl_export.csv records.json || true
          git commit -m "chore: update leads $(date +'%Y-%m-%d') ($(python -c "import json; d=json.load(open('dashboard/records.json')); print(d['total'],'records')"))" || exit 0
          git push origin main
