name: Scrape Harris County Motivated Seller Leads

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pypdf requests beautifulsoup4 lxml pytesseract pdf2image
          python -m playwright install chromium

      - name: Run scraper
        env:
          LOOKBACK_DAYS: "60"
        run: |
          python scraper/fetch.py

      - name: Verify output files exist
        run: |
          ls -la dashboard/ || true
          ls -la data/ || true

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html records.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update leads $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "No changes detected in data records."
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
