name: Scrape Harris County Motivated Seller Leads

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 02:00 AM CDT
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape"
  cancel-in-progress: false

jobs:
  scrape:
    name: Fetch Leads & Commit Data
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf pdf2image pytesseract requests beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          mkdir -p dashboard data tmp

      - name: Run scraper
        env:
          LOOKBACK_DAYS: "60"
        run: |
          python scraper/fetch.py
        timeout-minutes: 80

      - name: Verify output files exist
        run: |
          test -f dashboard/records.json && echo "dashboard/records.json ✓"
          test -f data/records.json     && echo "data/records.json ✓"

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add dashboard/records.json data/records.json data/ghl_export.csv || true
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          TOTAL=$(python -c "import json; print(json.load(open('dashboard/records.json'))['total'])")
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "chore: update leads ${DATE} (${TOTAL} records)"
          git pull --rebase origin main
          git push

  deploy-pages:
    name: Deploy Live Dashboard
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard/'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
