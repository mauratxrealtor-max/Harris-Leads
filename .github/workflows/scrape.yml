name: Scrape Harris County Motivated Seller Leads

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every single night at midnight (12:00 AM UTC)
    - cron: '0 0 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install OCR Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          pip install -r scraper/requirements.txt || echo "Requirements fallback"
          playwright install chromium

      - name: Run scraper
        run: |
          python scraper/fetch.py
        env:
          LOOKBACK_DAYS: 60
          CLERK_USER: ${{ secrets.CLERK_USER }}
          CLERK_PASS: ${{ secrets.CLERK_PASS }}

      - name: Verify output files exist
        run: |
          if [ ! -f "records.json" ]; then
            echo "Error: records.json was not generated!"
            exit 1
          fi

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add records.json
          git commit -m "chore: update leads $(date +'%Y-%m-%d')" || exit 0
          git push origin main --force
