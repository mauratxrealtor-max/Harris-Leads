<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harris County Motivated Seller Leads</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #4f7cff; --accent2: #ff6b35; --text: #e2e8f0;
      --muted: #7c8ba1; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .logo span { color: var(--accent2); }
    .meta { color: var(--muted); font-size: 12px; }
    .stats { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; min-width: 130px; }
    .stat-card .val { font-size: 24px; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .controls { display: flex; gap: 10px; padding: 0 24px 14px; flex-wrap: wrap; align-items: center; }
    .controls input, .controls select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 12px; font-size: 13px; outline: none; }
    .controls input { width: 220px; }
    .controls input:focus, .controls select:focus { border-color: var(--accent); }
    .btn { background: var(--accent); border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; padding: 7px 16px; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .table-wrap { overflow-x: auto; padding: 0 24px 40px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: var(--text); }
    th.sort-asc::after  { content: " ▲"; color: var(--accent); }
    th.sort-desc::after { content: " ▼"; color: var(--accent); }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:hover td { background: rgba(79,124,255,.07); }
    .score { display: inline-block; border-radius: 12px; font-weight: 700; font-size: 12px; padding: 2px 10px; }
    .score.high { background: rgba(34,197,94,.2); color: var(--green); }
    .score.mid  { background: rgba(245,158,11,.2); color: var(--yellow); }
    .score.low  { background: rgba(239,68,68,.18); color: var(--red); }
    .flag { display: inline-block; background: rgba(79,124,255,.15); border: 1px solid rgba(79,124,255,.3); border-radius: 4px; font-size: 10px; padding: 1px 6px; margin: 1px 2px 1px 0; white-space: nowrap; color: #a5b4fc; }
    .flag.red { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.3); color: #fca5a5; }
    .pill { display: inline-block; border-radius: 4px; font-size: 10px; font-weight: 700; padding: 2px 7px; background: rgba(255,107,53,.15); color: var(--accent2); white-space: nowrap; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-style: italic; }
    .pagination { display: flex; gap: 8px; padding: 12px 24px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    .pagination button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text); cursor: pointer; font-size: 12px; padding: 5px 11px; }
    .pagination button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .page-info { color: var(--muted); font-size: 12px; }
    #status { padding: 40px 24px; text-align: center; color: var(--muted); font-size: 15px; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 640px; width: 95%; max-height: 85vh; overflow-y: auto; padding: 24px; }
    .modal h2 { font-size: 16px; margin-bottom: 16px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-row { display: flex; flex-direction: column; }
    .modal-row .k { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
    .modal-row .v { font-size: 13px; word-break: break-word; }
    .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; }
  </style>
</head>

<header>
  <div>
