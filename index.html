<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harris County Motivated Seller Leads</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
      --accent: #4f7cff; --accent2: #ff6b35; --text: #e2e8f0;
      --muted: #7c8ba1; --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .logo span { color: var(--accent2); }
    .meta { color: var(--muted); font-size: 12px; }
    .stats { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; min-width: 130px; }
    .stat-card .val { font-size: 24px; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .controls { display: flex; gap: 10px; padding: 0 24px 14px; flex-wrap: wrap; align-items: center; }
    .controls input, .controls select { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 12px; font-size: 13px; outline: none; }
    .controls input { width: 220px; }
    .controls input:focus, .controls select:focus { border-color: var(--accent); }
    .btn { background: var(--accent); border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; padding: 7px 16px; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .table-wrap { overflow-x: auto; padding: 0 24px 40px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: var(--text); }
    th.sort-asc::after  { content: " ▲"; color: var(--accent); }
    th.sort-desc::after { content: " ▼"; color: var(--accent); }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:hover td { background: rgba(79,124,255,.07); }
    .score { display: inline-block; border-radius: 12px; font-weight: 700; font-size: 12px; padding: 2px 10px; }
    .score.high { background: rgba(34,197,94,.2); color: var(--green); }
    .score.mid  { background: rgba(245,158,11,.2); color: var(--yellow); }
    .score.low  { background: rgba(239,68,68,.18); color: var(--red); }
    .flag { display: inline-block; background: rgba(79,124,255,.15); border: 1px solid rgba(79,124,255,.3); border-radius: 4px; font-size: 10px; padding: 1px 6px; margin: 1px 2px 1px 0; white-space: nowrap; color: #a5b4fc; }
    .flag.red { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.3); color: #fca5a5; }
    .pill { display: inline-block; border-radius: 4px; font-size: 10px; font-weight: 700; padding: 2px 7px; background: rgba(255,107,53,.15); color: var(--accent2); white-space: nowrap; }
    .auction-badge { display: inline-block; background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4); border-radius: 4px; font-size: 10px; font-weight: 700; padding: 2px 7px; color: #fca5a5; white-space: nowrap; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-style: italic; }
    .pagination { display: flex; gap: 8px; padding: 12px 24px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    .pagination button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text); cursor: pointer; font-size: 12px; padding: 5px 11px; }
    .pagination button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .page-info { color: var(--muted); font-size: 12px; }
    #status { padding: 40px 24px; text-align: center; color: var(--muted); font-size: 15px; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 100; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 640px; width: 95%; max-height: 85vh; overflow-y: auto; padding: 24px; }
    .modal h2 { font-size: 16px; margin-bottom: 16px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-row { display: flex; flex-direction: column; }
    .modal-row .k { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
    .modal-row .v { font-size: 13px; word-break: break-word; }
    .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; }
  </style>
</head>
<body>
<header>
  <div>
    <div class="logo">Harris County <span>Motivated Sellers</span></div>
    <div class="meta" id="meta-line">Loading…</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-secondary" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn" onclick="location.reload()">↺ Refresh</button>
  </div>
</header>

<div id="status">Loading records…</div>

<div id="app" style="display:none">
  <div class="stats" id="stats-bar"></div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search owner, address, doc #…" oninput="applyFilters()" />
    <select id="filter-cat" onchange="applyFilters()">
      <option value="">All Lead Types</option>
      <option value="lp">Lis Pendens</option>
      <option value="foreclosure">Foreclosure</option>
      <option value="jud">Judgment</option>
      <option value="lien">Lien</option>
      <option value="probate">Probate</option>
      <option value="noc">Notice</option>
      <option value="rellp">Release</option>
    </select>
    <select id="filter-score" onchange="applyFilters()">
      <option value="">All Scores</option>
      <option value="70">Score ≥ 70 (Hot)</option>
      <option value="50">Score ≥ 50</option>
      <option value="30">Score ≥ 30</option>
    </select>
    <select id="filter-addr" onchange="applyFilters()">
      <option value="">All Records</option>
      <option value="1">Has Address</option>
    </select>
    <select id="filter-group" onchange="applyFilters()">
      <option value="">All Filings</option>
      <option value="1">Group by Owner</option>
    </select>
    <button class="btn btn-secondary" onclick="clearFilters()">✕ Clear</button>
    <span class="meta" id="filter-count"></span>
  </div>

  <div class="table-wrap">
    <table id="main-table">
      <thead>
        <tr>
          <th onclick="sortBy('score')">Score</th>
          <th onclick="sortBy('doc_type')">Type</th>
          <th onclick="sortBy('filed')">Filed</th>
          <th onclick="sortBy('auction_date')">Auction Date</th>
          <th onclick="sortBy('grantee')">Grantee (Owner)</th>
          <th onclick="sortBy('owner')">Grantor</th>
          <th onclick="sortBy('prop_address')">Property Address</th>
          <th onclick="sortBy('mail_address')">Mailing Address</th>
          <th>Flags</th>
          <th>Doc #</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 id="modal-title">Record Detail</h2>
    <div class="modal-grid" id="modal-body"></div>
  </div>
</div>

<script>
let ALL_RECORDS=[], filtered=[], sortCol='score', sortDir='desc', page=1;
const PAGE_SIZE=50;

async function loadData() {
  try {
    const resp = await fetch('records.json?v='+Date.now());
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    ALL_RECORDS = data.records||[];
    document.getElementById('meta-line').textContent =
      `Fetched ${data.fetched_at?new Date(data.fetched_at).toLocaleString():'N/A'} · ${data.date_range?.from||''} → ${data.date_range?.to||''}`;
    renderStats(data);
    applyFilters();
    document.getElementById('status').style.display='none';
    document.getElementById('app').style.display='block';
  } catch(e) {
    document.getElementById('status').textContent='Error loading dashboard/records.json: '+e.message;
  }
}

function renderStats(data) {
  const hot=ALL_RECORDS.filter(r=>r.score>=70).length;
  const warm=ALL_RECORDS.filter(r=>r.score>=50&&r.score<70).length;
  const nofc=ALL_RECORDS.filter(r=>r.doc_type==='NOFC').length;
  const html=[['Total Leads',data.total],['Hot (≥70)',hot],['Warm (50–69)',warm],['With Address',data.with_address||0],['Pre-Foreclosure',nofc]]
    .map(([l,v])=>`<div class="stat-card"><div class="val">${v}</div><div class="lbl">${l}</div></div>`).join('');
  document.getElementById('stats-bar').innerHTML=html;
}

function applyFilters() {
  const q=(document.getElementById('search').value||'').toLowerCase();
  const cat=document.getElementById('filter-cat').value;
  const minS=parseInt(document.getElementById('filter-score').value)||0;
  const addrOnly=document.getElementById('filter-addr').value==='1';
  const groupOwner=document.getElementById('filter-group').value==='1';

  let base=ALL_RECORDS.filter(r=>{
    if(minS&&r.score<minS) return false;
    if(cat&&r.cat!==cat) return false;
    if(addrOnly&&!r.prop_address) return false;
    if(q){
      const hay=[r.owner,r.grantee,r.doc_num,r.prop_address,r.mail_address,r.legal,r.auction_date].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(groupOwner){
    const m=new Map();
    for(const r of base){
      const k=(r.grantee||r.owner||'').toUpperCase().trim();
      if(!m.has(k)){m.set(k,{...r,_count:1});}
      else{
        const e=m.get(k); e._count++;
        if(r.score>e.score) m.set(k,{...r,_count:e._count});
        m.get(k).flags=[...new Set([...(e.flags||[]),(r.flags||[])])];
        if(!e.prop_address&&r.prop_address){m.get(k).prop_address=r.prop_address;m.get(k).mail_address=r.mail_address;}
      }
    }
    base=Array.from(m.values());
  }

  filtered=base; sortRecords(); page=1;
  document.getElementById('filter-count').textContent=`${filtered.length} records`;
  renderPage();
}

function clearFilters(){
  ['search','filter-cat','filter-score','filter-addr','filter-group'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  applyFilters();
}

function sortBy(col){
  if(sortCol===col) sortDir=sortDir==='asc'?'desc':'asc'; else{sortCol=col;sortDir='desc';}
  document.querySelectorAll('th').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  const headers=['score','doc_type','filed','auction_date','grantee','owner','prop_address','mail_address','','doc_num'];
  const idx=headers.indexOf(col);
  if(idx>=0) document.querySelectorAll('#main-table thead th')[idx]?.classList.add(sortDir==='asc'?'sort-asc':'sort-desc');
  sortRecords(); renderPage();
}

function sortRecords(){
  filtered.sort((a,b)=>{
    let av=a[sortCol]??'', bv=b[sortCol]??'';
    if(typeof av==='number'&&typeof bv==='number') return sortDir==='asc'?av-bv:bv-av;
    return sortDir==='asc'?String(av).localeCompare(String(bv)):String(bv).localeCompare(String(av));
  });
}

function renderPage(){
  const total=filtered.length, totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  page=Math.min(page,totalPages);
  const start=(page-1)*PAGE_SIZE;
  document.getElementById('table-body').innerHTML=filtered.slice(start,start+PAGE_SIZE).map((r,i)=>rowHTML(r,start+i)).join('');
  renderPagination(total,totalPages);
}

function scoreClass(s){return s>=70?'high':s>=50?'mid':'low';}

function flagHTML(flags){
  return(flags||[]).map(f=>`<span class="flag${/foreclos|pendens|judgment|tax lien/i.test(f)?' red':''}">${f}</span>`).join('');
}

function fmtAddr(addr,city,zip){
  const full=[addr,city,zip].filter(Boolean).join(', ');
  if(!full) return '<span class="empty">—</span>';
  return full.length>35?`<span title="${full}">${full.substring(0,35)}…</span>`:full;
}

function trunc(s,n){
  if(!s) return '<span class="empty">—</span>';
  return s.length>n?`<span title="${s}">${s.substring(0,n)}…</span>`:s;
}

function fmtAuctionDate(r){
  if(r.doc_type!=='NOFC') return '<span class="empty">—</span>';
  if(!r.auction_date) return '<span class="empty">—</span>';
  // Highlight upcoming auctions in red
  const d = new Date(r.auction_date);
  const today = new Date();
  const daysOut = Math.ceil((d - today) / (1000*60*60*24));
  if(daysOut <= 7) return `<span class="auction-badge">🔴 ${r.auction_date}</span>`;
  return `<span style="color:var(--yellow);font-weight:600">${r.auction_date}</span>`;
}

function rowHTML(r,idx){
  const docLink=r.clerk_url
    ?`<a href="${r.clerk_url}" target="_blank" rel="noopener">${r.doc_num||'—'}</a>`
    :(r.doc_num||'<span class="empty">—</span>');
  const badge=r._count>1?` <span style="background:#4f7cff22;color:#4f7cff;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:4px">${r._count} filings</span>`:'';
  return `<tr onclick="showDetail(${idx})" style="cursor:pointer">
    <td><span class="score ${scoreClass(r.score)}">${r.score}</span></td>
    <td><span class="pill">${r.doc_type}</span></td>
    <td>${r.filed||'<span class="empty">—</span>'}</td>
    <td>${fmtAuctionDate(r)}</td>
    <td title="${r.grantee||''}">${trunc(r.grantee,30)}${badge}</td>
    <td title="${r.owner||''}">${trunc(r.owner,25)}</td>
    <td>${fmtAddr(r.prop_address,r.prop_city,r.prop_zip)}</td>
    <td>${fmtAddr(r.mail_address,r.mail_city,r.mail_zip)}</td>
    <td>${flagHTML(r.flags)}</td>
    <td>${docLink}</td>
  </tr>`;
}

function renderPagination(total,totalPages){
  let html=`<span class="page-info">${total} records · Page ${page}/${totalPages}</span>`;
  html+=`<button onclick="goPage(${page-1})" ${page<=1?'disabled':''}>‹ Prev</button>`;
  for(let p2=Math.max(1,page-2);p2<=Math.min(totalPages,page+2);p2++)
    html+=`<button class="${p2===page?'active':''}" onclick="goPage(${p2})">${p2}</button>`;
  html+=`<button onclick="goPage(${page+1})" ${page>=totalPages?'disabled':''}>Next ›</button>`;
  document.getElementById('pagination').innerHTML=html;
}

function goPage(p2){page=p2;renderPage();window.scrollTo({top:0,behavior:'smooth'});}

function showDetail(localIdx){
  const r=filtered[(page-1)*PAGE_SIZE+localIdx];
  if(!r) return;
  document.getElementById('modal-title').textContent=`${r.cat_label||r.doc_type} — ${r.doc_num||'N/A'}`;
  const fields=[
    ['Document #',r.doc_num],['Doc Type',`${r.doc_type} · ${r.cat_label}`],
    ['Filed Date',r.filed],['Auction Date',r.auction_date||'—'],['Score',r.score],
    ['Grantee (Owner)',r.grantee],['Grantor (Filer)',r.owner],
    ['Amount',r.amount?'$'+Number(r.amount).toLocaleString():'—'],
    ['Property Address',[r.prop_address,r.prop_city,r.prop_state,r.prop_zip].filter(Boolean).join(', ')],
    ['Mailing Address',[r.mail_address,r.mail_city,r.mail_state,r.mail_zip].filter(Boolean).join(', ')],
    ['Legal Desc.',r.legal],['Flags',(r.flags||[]).join('; ')],
    ['Clerk URL',r.clerk_url?`<a href="${r.clerk_url}" target="_blank">View Document ↗</a>`:'—'],
  ];
  document.getElementById('modal-body').innerHTML=fields.map(([k,v])=>
    `<div class="modal-row"><span class="k">${k}</span><span class="v">${v||'<em>—</em>'}</span></div>`).join('');
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function exportCSV(){
  const cols=['score','doc_type','cat_label','filed','auction_date','owner','grantee','amount',
              'prop_address','prop_city','prop_state','prop_zip',
              'mail_address','mail_city','mail_state','mail_zip',
              'doc_num','flags','clerk_url','legal'];
  const rows=filtered.map(r=>cols.map(c=>{
    let v=c==='flags'?(r.flags||[]).join('; '):(r[c]??'');
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(','));
  const blob=new Blob([cols.join(',')+'\n'+rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`harris_leads_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

loadData();
</script>
</body>
</html>
